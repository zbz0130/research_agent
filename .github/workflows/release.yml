name: Release Windows app

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest
    env:
      HAS_WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Python sidecar dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r backend\requirements-dev.txt pyinstaller

      - name: Build and publish Tauri installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The repository root contains both `frontend/` and `src-tauri/`.
          # projectPath must therefore be the repository root so the action
          # can discover src-tauri/tauri.conf.json.
          projectPath: ./
          tauriScript: frontend/node_modules/.bin/tauri.cmd
          tagName: v__VERSION__
          releaseName: WishForge v__VERSION__
          releaseBody: |
            Windows x64 desktop installer for WishForge.

            Download `WishForge_*_x64-setup.exe`, run it, and then launch WishForge from the Start menu or desktop shortcut.
          # Keep the release private until the optional Authenticode signing
          # step has had a chance to replace the unsigned installer.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true

      - name: Sign Windows installer when a publisher certificate is configured
        if: ${{ github.ref_type == 'tag' && env.HAS_WINDOWS_SIGNING_CERT == 'true' }}
        shell: pwsh
        env:
          WISHFORGE_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WISHFORGE_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "wishforge-signing.pfx"
          [System.IO.File]::WriteAllBytes(
            $certificatePath,
            [System.Convert]::FromBase64String($env:WISHFORGE_CERTIFICATE_BASE64)
          )
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signTool) {
            throw "signtool.exe was not found on the Windows runner."
          }
          $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis" -Filter "WishForge_*-setup.exe" |
            Select-Object -First 1
          if ($null -eq $installer) {
            throw "WishForge NSIS installer was not produced."
          }
          & $signTool.FullName sign /fd SHA256 /f $certificatePath /p $env:WISHFORGE_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $installer.FullName
          if ($LASTEXITCODE -ne 0) {
            throw "Authenticode signing failed with exit code $LASTEXITCODE."
          }
          "WISHFORGE_SIGNED_INSTALLER=$($installer.FullName)" | Add-Content -Path $env:GITHUB_ENV

      - name: Replace the release asset with the signed installer
        if: ${{ github.ref_type == 'tag' && env.HAS_WINDOWS_SIGNING_CERT == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" "$env:WISHFORGE_SIGNED_INSTALLER" --clobber

      - name: Publish release
        if: ${{ github.ref_type == 'tag' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false
