services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      WISHFORGE_APP_NAME: "许愿机 API"
      WISHFORGE_BRAND_NAME: "许愿机"
      WISHFORGE_BRAND_NAME_EN: "WishForge"
      WISHFORGE_VERSION: "0.1.0"
      WISHFORGE_CORS_ORIGINS: "http://localhost:8000"
      WISHFORGE_PAPER_PROVIDER: "semantic_scholar"
      WISHFORGE_EXPLANATION_PROVIDER: "openai"
      WISHFORGE_EXPERIMENT_PROVIDER: "local"
      WISHFORGE_PAPER_API_KEY: "${WISHFORGE_PAPER_API_KEY:-}"
      WISHFORGE_EXPLANATION_API_KEY: "${WISHFORGE_EXPLANATION_API_KEY:-}"
      WISHFORGE_EXPERIMENT_API_KEY: "${WISHFORGE_EXPERIMENT_API_KEY:-}"
